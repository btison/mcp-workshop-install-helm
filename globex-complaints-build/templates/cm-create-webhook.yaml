apiVersion: v1
kind: ConfigMap
metadata:
  name:  create-webhook-script
  labels:
    {{- include "globex-complaints-build.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.job.createWebhook.argocd.syncwave }}"
data:
  playbook.yaml: |
    - hosts: localhost
      vars:
        git_host: {{ .Values.gitlab.host }}
        git_project: {{ .Values.gitlab.repo }}
        git_token: ""
        webhook_url: https://{{ include "globex-complaints-build.name" . }}-el-{{ .Release.Namespace }}.{{ .Values.cluster.subdomain }}
        webhook_secret: {{ .Values.gitlab.webhookSecret }}
      tasks:
        - name: Get gitlab projects
          ansible.builtin.uri:
            url: https://{{ "{{" }} git_host {{ "}}" }}/api/v4/projects?per_page=100
            method: GET
            body_format: form-urlencoded
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} git_token {{ "}}" }}'
            validate_certs: false
            status_code: [200]
          register: r_git_projects

        - name: set gitlab projects id
          set_fact:
            git_project_id: '{{ "{{" }} r_git_projects.json | json_query(query) {{ "}}" }}'
          vars:
            query: {{ "\"" }}[?name=='{{ "{{" }} git_project {{ "}}" }}'].id{{ "\"" }}

        - name: Create {{ "{{" }} git_project {{ "}}" }} web hook
          ansible.builtin.uri:
            url: https://{{ "{{" }} git_host {{ "}}" }}/api/v4/projects/{{ "{{" }} git_project_id[0] {{ "}}" }}/hooks
            method: POST
            body_format: form-urlencoded
            body:
              url: '{{ "{{" }} webhook_url {{ "}}" }}'
              push_events: true
              tag_push_events: true
              releases_events: true
              token: '{{ "{{" }} webhook_secret {{ "}}" }}'
              enable_ssl_verification: false
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} git_token {{ "}}" }}'
            validate_certs: false
            status_code: [201]
