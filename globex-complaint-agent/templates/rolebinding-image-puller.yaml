apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "globex-complaint-agent.name" . }}-image-puller
  labels:
    {{- include "globex-complaint-agent.labels" . | nindent 4 }}
  namespace: {{ .Values.roleBinding.imagePull.namespace }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'system:image-puller'
subjects:
- apiGroup: ""
  kind: ServiceAccount
  name: {{ include "globex-complaint-agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}